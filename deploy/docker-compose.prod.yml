# Producción YAPAI — docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
# Requiere deploy/.env.production (ver .env.production.example)
# 4 imágenes propias: api (backend), cliente, socio, admin (SvelteKit adapter-node)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Rate limiting distribuido (sin esto el limiter es en-memoria por proceso
    # y cada réplica cuenta por separado — el backend lo advierte en logs)
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      POSTGRES_HOST: db
      ENV: production
      DEBUG: "false"
      # Jobs periódicos corren en el servicio `jobs` (abajo) — único ejecutor,
      # así pueden escalar réplicas de `api` sin duplicar facturación/expiración
      JOBS_ENABLED: "false"
      SEED_DEMO: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      OTP_PROVIDER: ${OTP_PROVIDER:-webhook}
      OTP_WEBHOOK_URL: ${OTP_WEBHOOK_URL:-}
      REQUIRE_SUPERADMIN_2FA: ${REQUIRE_SUPERADMIN_2FA:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.${DOMAIN}}
      FRONTEND_SOCIO_URL: https://app.${DOMAIN}
      FRONTEND_ADMIN_URL: https://admin.${DOMAIN}
      FRONTEND_CLIENTE_URL: https://${DOMAIN}
      REDIS_URL: redis://redis:6379/0
      SIGNUP_MODE: ${SIGNUP_MODE:-auto}
      LOG_JSON: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Web Push (cliente): par VAPID generado con py-vapid/cryptography
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@yapai.com}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@yapai.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobs:
    # Único ejecutor de jobs periódicos (expiración de pases + facturación/mora).
    # Misma imagen que api; no expone puertos ni recibe tráfico.
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      ENV: production
      DEBUG: "false"
      JOBS_ENABLED: "false"
      SEED_DEMO: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      OTP_PROVIDER: ${OTP_PROVIDER:-webhook}
      OTP_WEBHOOK_URL: ${OTP_WEBHOOK_URL:-}
      REQUIRE_SUPERADMIN_2FA: ${REQUIRE_SUPERADMIN_2FA:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.${DOMAIN}}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@yapai.com}
      FACTURA_VENCE_DIA: ${FACTURA_VENCE_DIA:-10}
      FACTURA_GRACIA_DIAS: ${FACTURA_GRACIA_DIAS:-7}
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  cliente:
    # PWA del cliente final (apex + www)
    build: ../frontend_cliente
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE: https://api.${DOMAIN}/api/v1
      ORIGIN: https://${DOMAIN}
    depends_on:
      - api

  socio:
    build: ../frontend_socio
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE: https://api.${DOMAIN}/api/v1
      ORIGIN: https://app.${DOMAIN}
    depends_on:
      - api

  admin:
    build: ../frontend_administrador
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE: https://api.${DOMAIN}/api/v1
      ORIGIN: https://admin.${DOMAIN}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - cliente
      - socio
      - admin

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
