services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yapai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yapai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: yapai_db
      SEED_DEMO: "true"
      # Producción: definir JWT_SECRET y CORS_ORIGINS reales via env / .env
    # Dev sí siembra datos demo automáticamente (el CMD de la imagen no lo hace)
    command: >
      sh -c "python -m alembic upgrade head && python -m app.seed --demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
