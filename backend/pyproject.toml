[tool.ruff]
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

# FastAPI usa Depends()/Query()/Field() como defaults de parámetro a propósito —
# sin esto B008 marca ~200 falsos positivos en los routers.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "pydantic.Field",
]
