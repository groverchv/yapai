name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest
        working-directory: backend
      - name: Invariant tests
        run: python -m pytest tests/ -q
        working-directory: backend

  frontend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_administrador/package-lock.json
      - run: npm ci
        working-directory: frontend_administrador
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
        working-directory: frontend_administrador
      - run: npm run build
        working-directory: frontend_administrador

  frontend-socio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_socio/package-lock.json
      - run: npm ci
        working-directory: frontend_socio
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
        working-directory: frontend_socio
      - run: npm run build
        working-directory: frontend_socio

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: movil_cliente
      - run: flutter analyze
        working-directory: movil_cliente
      - run: flutter test
        working-directory: movil_cliente

  docker:
    # Valida que las 3 imágenes compilan (sin push; el publish va aparte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yapai-api:ci backend
      - run: docker build -t yapai-socio:ci frontend_socio
      - run: docker build -t yapai-admin:ci frontend_administrador
